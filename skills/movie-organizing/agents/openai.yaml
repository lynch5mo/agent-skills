interface:
  display_name: "Movie Organizing"
  short_description: "四项核心门禁：命名、孤立建夹、导演归类、质量去重"
  default_prompt: "Use $movie-organizing within the explicit TASK_ROOT. First run the bundled standard-library verify-install check, then lock scope and read the full naming contract; run preprocessor plan/dry-run, safe apply, and verify before any Agent reasoning or hand-written mv. Treat preprocessor verify PASS as naming_plan_only, not task completion. Keep only NAMING_PASS/ACTION_REQUIRED/EXCEPTION, route ambiguity to _待确认_, then run the fresh-tree audit: CORE_GATE must pass before all active movies (including NAMING_PASS) enter cross-directory duplicate-candidate scanning; never auto-delete by name or size, and take completion wording only from the audit recovery JSON."
