interface:
  display_name: "Movie Organizing"
  short_description: "四项核心门禁：命名、孤立建夹、导演归类、质量去重"
  default_prompt: "Use $movie-organizing within the explicit TASK_ROOT. First run the bundled standard-library verify-install check, then lock scope and read the full naming contract; run preprocessor plan/dry-run, safe apply, and verify before any Agent reasoning or hand-written mv. Normalize director Chinese transliteration separators to U+00B7 only when the v1.3.3 migration syntax is unambiguous; flatten deterministic movie leaves from any finite wrapper depth to the director root, archive proven-empty wrappers once under _work-record_/flattened-empty, and rename each director only after every child action succeeds. Treat preprocessor verify PASS as naming_plan_only, not task completion. Keep only NAMING_PASS/ACTION_REQUIRED/EXCEPTION, route ambiguity to _待确认_, then run the fresh-tree audit: CORE_GATE must pass before all active movies (including NAMING_PASS) enter cross-directory duplicate-candidate scanning; never auto-delete by name or size, and take completion wording only from the audit recovery JSON."
