interface:
  display_name: "Movie Organizing"
  short_description: "四项核心门禁：命名、孤立建夹、导演归类、质量去重"
  default_prompt: "Use $movie-organizing for unattended work within an explicit TASK_ROOT. First enforce the four CORE duties: exact contract naming for every retained director/movie/video/NFO/subtitle path; create standard folders for orphan videos; split and rehome dispersed/collection films into the correct director folders; then pass CORE_GATE before identity+edition/cut dedupe and DEDUPE_GATE. Build a filename-only inventory, read the full naming-contract, record expected_* paths and source_shape for every video unit, classify only NAMING_PASS/ACTION_REQUIRED/EXCEPTION, process ACTION_REQUIRED in locked 10–20 unit batches, route uncertainty to the minimum complete unit in _待确认_, and require active CORE/DEDUPE counters (including NFO/subtitle) plus现场 old-absent/new-exists evidence before cleanup or any completion report."
